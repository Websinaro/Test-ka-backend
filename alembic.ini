[alembic]
# Path to migration scripts folder
script_location = alembic

# Prepend current directory to sys.path so imports work
prepend_sys_path = .

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Max length of characters in autogenerated filenames
truncate_slug_length = 40

# Default database connection string placeholder 
# (Overridden dynamically by your env.py using DATABASE_URL)
sqlalchemy.url = postgresql://user:password@localhost/dbname

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
